name: Add IPTV Smarters Pro button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-smarters-button.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add IPTV Smarters Pro button to Installation Guide
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="hero-actions"><a class="button button-primary" href="#uredjaji" data-g="chooseDevice">Izaberi uređaj</a><a class="button button-secondary" href="#tivimate" data-g="tivimateGuide">TiviMate uputstvo</a></div>'
          new = '<div class="hero-actions"><a class="button button-primary" href="#uredjaji" data-g="chooseDevice">Izaberi uređaj</a><a class="button button-secondary" href="#tivimate" data-g="tivimateGuide">TiviMate uputstvo</a><a class="button button-secondary" href="iptv-smarters-pro/">IPTV Smarters Pro</a></div>'
          if 'href="iptv-smarters-pro/"' not in s:
              if old not in s:
                  raise SystemExit('Target hero actions block not found')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No change needed"
          else
            git commit -m "Add IPTV Smarters Pro button to installation guide"
            git push
          fi
